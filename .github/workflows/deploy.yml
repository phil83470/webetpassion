name: Deploiement automatique vers o2switch

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Envoi des fichiers modifiés
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code GitHub
        uses: actions/checkout@v4

      - name: Synchronisation FTP vers o2switch
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
