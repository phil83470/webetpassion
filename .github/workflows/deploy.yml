name: Deploiement automatique vers o2switch

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Envoi SFTP des fichiers vers o2switch
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code GitHub
        uses: actions/checkout@v4

      - name: Synchronisation SFTP vers o2switch
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          source: "*,*/*"
          target: "/home/jiph2812"
          rm: false
